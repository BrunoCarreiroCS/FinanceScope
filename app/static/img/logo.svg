<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- FinanceScope — marca "Relógio de Vida":
       anel jade (dinheiro) aberto no topo-direito, com o ponto âmbar
       marcando o tempo. Mesmo conceito do dial do dashboard. -->
  <defs>
    <linearGradient id="fs-jade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3dd68c"/>
      <stop offset="1" stop-color="#1faf6a"/>
    </linearGradient>
  </defs>
  <circle cx="24" cy="24" r="17" fill="none" stroke="url(#fs-jade)"
          stroke-width="5.5" stroke-linecap="round"
          stroke-dasharray="80 26.81"/>
  <circle cx="36" cy="12" r="3.4" fill="#f0a64b"/>
</svg>
