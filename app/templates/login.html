<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Entrar — {{ app_name }}</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body class="auth">
  <div class="auth-card">
    <a href="{{ url_for('home') }}" class="brand auth-brand">
      <img class="brand-logo" src="{{ url_for('static', filename='img/logo.png') }}" alt="FinanceScope" />
      <span class="brand-name">Finance<strong>Scope</strong></span>
    </a>

    <h1 class="auth-title">Entrar</h1>
    <p class="muted">Acesse sua conta para continuar.</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, msg in messages %}
        <div class="flash flash-{{ category }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    <form method="post" class="form" autocomplete="on">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <label>E-mail
        <input type="email" name="email" value="{{ form.email or '' }}" required autofocus />
      </label>
      <label>Senha
        <input type="password" name="password" required />
      </label>
      <button type="submit" class="btn btn-primary btn-lg" style="width:100%">Entrar</button>
    </form>

    <p class="muted small auth-alt">
      Não tem conta? <a href="{{ url_for('registro') }}" class="link">Criar conta</a>
    </p>
  </div>
</body>
</html>
