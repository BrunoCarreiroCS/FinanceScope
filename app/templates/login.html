<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0a0e13" />
  <title>Entrar — {{ app_name }}</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;0,9..144,900;1,9..144,800&family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body class="auth">
  <div class="auth-card">
    <a href="{{ url_for('main.home') }}" class="brand auth-brand">
      <img class="brand-logo" src="{{ url_for('static', filename='img/logo.svg') }}" alt="FinanceScope" width="34" height="34" />
      <span class="brand-name">Finance<strong>Scope</strong></span>
    </a>

    <h1 class="auth-title">Entrar</h1>
    <p class="muted">Acesse sua conta para continuar.</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
      <div role="status" aria-live="polite">
        {% for category, msg in messages %}
          <div class="flash flash-{{ category }}">{{ msg }}</div>
        {% endfor %}
      </div>
      {% endif %}
    {% endwith %}

    <form method="post" class="form" autocomplete="on">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <label>E-mail
        <input type="email" name="email" value="{{ form.email or '' }}"
               autocomplete="email" inputmode="email" spellcheck="false"
               required autofocus />
      </label>
      <label>Senha
        <input type="password" name="password"
               autocomplete="current-password" required />
      </label>
      <button type="submit" class="btn btn-primary btn-lg" style="width:100%">Entrar</button>
    </form>

    <p class="muted small auth-alt">
      Não tem conta? <a href="{{ url_for('auth.registro') }}" class="link">Criar conta</a>
    </p>
  </div>
</body>
</html>
