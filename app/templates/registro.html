<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Criar conta — {{ app_name }}</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;0,9..144,900;1,9..144,800&family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body class="auth">
  <div class="auth-card">
    <a href="{{ url_for('home') }}" class="brand auth-brand">
      <img class="brand-logo" src="{{ url_for('static', filename='img/logo.svg') }}" alt="FinanceScope" />
      <span class="brand-name">Finance<strong>Scope</strong></span>
    </a>

    <h1 class="auth-title">Criar conta</h1>
    <p class="muted">Leva menos de um minuto. Seus dados ficam só seus.</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, msg in messages %}
        <div class="flash flash-{{ category }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    <form method="post" class="form" autocomplete="on" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <label>Nome
        <input type="text" name="name" value="{{ form.name or '' }}" required autofocus
               autocomplete="name"
               aria-invalid="{{ 'true' if errors.name else 'false' }}"
               {% if errors.name %}aria-describedby="err-name"{% endif %} />
        {% if errors.name %}<span id="err-name" class="field-error" role="alert">{{ errors.name }}</span>{% endif %}
      </label>
      <label>E-mail
        <input type="email" name="email" value="{{ form.email or '' }}" required
               autocomplete="email"
               aria-invalid="{{ 'true' if errors.email else 'false' }}"
               {% if errors.email %}aria-describedby="err-email"{% endif %} />
        {% if errors.email %}<span id="err-email" class="field-error" role="alert">{{ errors.email }}</span>{% endif %}
      </label>
      <label>Senha
        <input type="password" name="password" required
               autocomplete="new-password"
               aria-invalid="{{ 'true' if errors.password else 'false' }}"
               {% if errors.password %}aria-describedby="err-password"{% endif %} />
        {% if errors.password %}<span id="err-password" class="field-error" role="alert">{{ errors.password }}</span>{% endif %}
      </label>
      <label>Confirmar senha
        <input type="password" name="confirm" required
               autocomplete="new-password"
               aria-invalid="{{ 'true' if errors.confirm else 'false' }}"
               {% if errors.confirm %}aria-describedby="err-confirm"{% endif %} />
        {% if errors.confirm %}<span id="err-confirm" class="field-error" role="alert">{{ errors.confirm }}</span>{% endif %}
      </label>
      <button type="submit" class="btn btn-primary btn-lg" style="width:100%">Criar conta</button>
    </form>

    <p class="muted small auth-alt">
      Já tem conta? <a href="{{ url_for('login') }}" class="link">Entrar</a>
    </p>
  </div>
</body>
</html>
